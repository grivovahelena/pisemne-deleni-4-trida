<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pekárna U Dělicího válečku</title>
<style>
:root{
  --krem:#FFF4E0; --mouka:#FFFBF3; --kura:#C8843A; --cokolada:#5B3A29; --maslo:#F6C945;
  --zelena:#3F8A43; --zelena-svetla:#E3F3DF; --koral:#D9674E; --koral-svetla:#FBE3DC;
  --modra-svetla:#E2EEF9; --zluta-svetla:#FFF3C4; --papir:#D3E2F0;
  --bunka:min(2.7rem, 7.6vw);
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:Verdana, system-ui, sans-serif;color:var(--cokolada);background:var(--krem);
  background-image:radial-gradient(#f3e2c2 1.2px, transparent 1.3px);background-size:22px 22px;line-height:1.45}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,.lista-nazev,.diplom-nadpis,.diplom-titul{font-family:Georgia, 'Times New Roman', serif}
h2{margin:22px 0 10px;font-size:1.3rem}
.obrazovka{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.skryte{display:none !important}

/* Lišta */
.lista{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cokolada);color:var(--krem);
  border-radius:16px;padding:8px 12px;margin-bottom:10px}
.lista-nazev{font-weight:bold;font-size:1.1rem;flex:1;min-width:150px}
.lista-pocet{font-weight:bold;background:var(--kura);border-radius:10px;padding:4px 10px}
.lista-tl{display:flex;gap:6px}
.lista button{min-width:44px;min-height:44px;border:none;border-radius:10px;background:var(--kura);color:#fff;font-size:1rem;font-weight:bold;padding:0 10px}
.tl-mensi{min-height:44px}
.progres{height:12px;background:#ead7b6;border-radius:6px;overflow:hidden;margin-bottom:12px}
.progres div{height:100%;background:linear-gradient(90deg,var(--maslo),var(--kura));transition:width .4s}

/* Tlačítka */
.tl-hlavni{display:block;margin:16px auto 0;min-height:56px;padding:10px 28px;font-size:1.15rem;font-weight:bold;
  border:none;border-radius:16px;background:var(--kura);color:#fff;box-shadow:0 4px 0 var(--cokolada)}
.tl-hlavni:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cokolada)}
.tl-hlavni:disabled{background:#cdb595;box-shadow:none;cursor:default}
.tl-druhe{min-height:50px;padding:8px 20px;font-size:1rem;font-weight:bold;border:3px solid var(--kura);border-radius:14px;background:var(--mouka)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav .tl-hlavni{margin:0}
.pulz{outline:4px solid var(--maslo);outline-offset:2px}

/* Úvod */
.uvod-karta{max-width:640px;margin:20px auto;background:var(--mouka);border:4px solid var(--kura);border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 0 #e6c99c}
.uvod-pekar{font-size:4rem}
.uvod-karta h1{margin:4px 0;font-size:1.8rem}
.podtitul{font-weight:bold;color:var(--kura)}
.pribeh{font-size:1.05rem;text-align:left;background:#fff;border-radius:14px;padding:14px;border:2px dashed var(--kura)}
.uvod-karta label{display:block;margin-top:14px;font-weight:bold}
.uvod-karta input{margin-top:8px;width:100%;max-width:360px;font-size:1.2rem;padding:12px;border:3px solid var(--kura);border-radius:12px;text-align:center;font-family:inherit}
.autor{margin-top:16px;font-size:.85rem;opacity:.8}

/* Scéna pekárny */
.scena{position:relative;height:250px;border-radius:20px;overflow:hidden;background:linear-gradient(#bfe3f2,#fdf1d8);border:3px solid var(--kura);margin:10px 0}
.slunce{position:absolute;top:16px;right:24px;width:46px;height:46px;border-radius:50%;background:var(--maslo);box-shadow:0 0 22px #f6c94599}
.zeme{position:absolute;bottom:0;left:0;right:0;height:40px;background:#9cc77a;border-top:3px solid #7aa95a}
.budova{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:240px;height:132px;background:#f3d9b1;border:3px solid var(--cokolada);border-bottom:none}
.strecha{position:absolute;top:-64px;left:-22px;width:278px;height:62px;background:var(--kura);clip-path:polygon(50% 0,100% 100%,0 100%)}
.stit{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--cokolada);color:var(--maslo);font:bold .72rem Georgia,serif;padding:3px 8px;border-radius:6px;white-space:nowrap}
.pec{position:absolute;left:14px;bottom:0;width:58px;height:62px;background:#6e4430;border-radius:29px 29px 0 0;display:flex;align-items:center;justify-content:center}
.pec .ohen{font-size:1.7rem;opacity:0;transition:opacity .6s}
.pec.hori .ohen{opacity:1}
.pec.hori{box-shadow:inset 0 -10px 18px #f28c28}
.vyloha{position:absolute;left:84px;top:36px;width:92px;height:66px;background:#dff1fb;border:3px solid var(--cokolada);border-radius:6px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;font-size:1.05rem}
.dvere{position:absolute;right:14px;bottom:0;width:40px;height:68px;background:var(--cokolada);border-radius:20px 20px 0 0}
.kvetiny{position:absolute;bottom:32px;left:calc(50% - 150px);font-size:1.3rem}
.lampa{position:absolute;bottom:128px;left:calc(50% + 126px);font-size:1.4rem}
.dodavka{position:absolute;bottom:30px;right:6px;font-size:2.6rem;transform:scaleX(-1)}
.pohar{position:absolute;bottom:38px;left:8px;font-size:2.4rem}
.prapory{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:1.5rem;white-space:nowrap}
.prvek{opacity:0;scale:.5;transition:opacity .5s, scale .5s}
.prvek.ma{opacity:1;scale:1}
.novy, .pec.novy .ohen{animation:objev 1.2s ease-out}
@keyframes objev{0%{scale:0}65%{scale:1.35}100%{scale:1}}
.vitej{font-size:1.05rem}

/* Dlaždice */
.dlazdice{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.karta{text-align:left;background:var(--mouka);border:3px solid var(--kura);border-radius:16px;padding:12px 14px;min-height:96px;display:flex;gap:10px;align-items:flex-start;font-size:1rem}
.karta .k-ikona{font-size:2rem;line-height:1}
.karta .k-nazev{font-weight:bold;font-family:Georgia,serif;font-size:1.08rem}
.karta .k-popis{font-size:.88rem;opacity:.85}
.karta .k-stav{margin-top:4px;font-size:.95rem}
.karta.hotova{background:var(--zelena-svetla);border-color:var(--zelena)}
.karta.zamcena{opacity:.55;cursor:not-allowed;border-style:dashed}
.tip{text-align:center;font-weight:bold;margin-top:18px}

/* Pracovní obrazovka */
.pracovni{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){ .pracovni{grid-template-columns:1fr 300px} .pracovni .ovladani{grid-row:1 / span 2;grid-column:2} .pracovni .karta-ulohy,.pracovni .kvasek-obal{grid-column:1} }
.karta-ulohy{background:var(--mouka);border:3px solid var(--kura);border-radius:20px;padding:16px;min-height:160px;overflow-x:auto}
.zadani{font-size:1.15rem;font-weight:bold;margin-bottom:10px}
.zadani.slovni{font-weight:normal;background:#fff;border-left:6px solid var(--maslo);padding:10px 12px;border-radius:10px}
.radek-zpameti{font-size:1.6rem;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0}
.bunka{display:inline-flex;align-items:center;justify-content:center;min-width:2.6rem;height:2.9rem;padding:0 6px;border:3px dashed var(--kura);border-radius:10px;background:#fff;font-weight:bold}
.bunka.siroka{min-width:3.4rem}.bunka.siroka4{min-width:5rem}
.bunka.aktivni{border-style:solid;background:var(--zluta-svetla);box-shadow:0 0 0 4px #f6c94566}
.bunka.hotove{border-style:solid;border-color:var(--zelena);color:var(--zelena)}
.bunka.odhaleno{border-style:solid;border-color:#3b7bbf;color:#2a5f99}
.spatne{background:var(--koral-svetla) !important;border-color:var(--koral) !important;animation:tres .35s}
@keyframes tres{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.male{font-size:.9rem;opacity:.85}

/* Mřížka písemného dělení (čtverečkovaný sešit) */
.mrizka-obal{overflow-x:auto;padding:6px 0}
.mrizka{display:inline-grid;grid-auto-rows:var(--bunka);font-size:calc(var(--bunka) * .62);font-weight:bold;
  background-color:#fff;background-image:linear-gradient(var(--papir) 1px, transparent 1px),linear-gradient(90deg,var(--papir) 1px, transparent 1px);
  background-size:var(--bunka) var(--bunka);border:1px solid var(--papir);padding:0}
.mrizka .b{display:flex;align-items:center;justify-content:center;border-radius:6px;border:2px solid transparent;margin:1px}
.mrizka .b.znak{color:var(--kura)}
.mrizka .b.podil{border:2px dashed var(--kura);background:#fffdf6}
.mrizka .b.vstup{visibility:hidden}
.mrizka .b.vstup.aktivni,.mrizka .b.vstup.hotove,.mrizka .b.vstup.odhaleno,.mrizka .b.vstup.ukazane{visibility:visible}
.mrizka .b.aktivni{border:3px solid var(--kura);background:var(--zluta-svetla);box-shadow:0 0 0 3px #f6c94566}
.mrizka .b.hotove{color:var(--cokolada)}
.mrizka .b.podil.hotove{border-style:solid;border-color:var(--zelena);color:var(--zelena)}
.mrizka .b.odhaleno{color:#2a5f99}
.mrizka .b.zvyr{background:#FFE38A;border-color:#E0A800}
.vysledek{font-size:1.5rem;font-weight:bold;color:var(--zelena);margin-top:10px}
.zkouska-ukaz{font-size:1.15rem;margin-top:6px}
.zkouska{margin-top:10px;padding-top:8px;border-top:2px dashed #e1c9a2}
.cara-radek{border-top:3px solid var(--cokolada);pointer-events:none;align-self:start}
.zkouska-ukaz .mrizka{margin:6px 0}
.zkouska-mrizka .znak{font-size:1.4em}
.pred .zadani{font-size:1rem}

/* Volby */
.volby{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.volba{min-height:56px;font-size:1.1rem;font-weight:bold;border:3px solid var(--kura);border-radius:14px;background:#fff;padding:8px}
.volba.ok{background:var(--zelena-svetla);border-color:var(--zelena);color:var(--zelena)}
.volba.ne{background:var(--koral-svetla);border-color:var(--koral);opacity:.7}
.volba:disabled{cursor:default}

/* Kvásek a bublina */
.kvasek{display:flex;gap:10px;align-items:flex-start}
.kvasek-tvar{font-size:2.8rem;line-height:1;flex:none}
.bublina{flex:1;background:#fff;border:3px solid var(--kura);border-radius:18px;padding:12px 14px;font-size:1.05rem;position:relative;min-height:56px}
.bublina:before{content:"";position:absolute;left:-12px;top:16px;border:10px solid transparent;border-right-color:var(--kura);border-left:0}
.bublina.napoveda{background:var(--zluta-svetla)}
.bublina.vysvetli{background:var(--modra-svetla);border-color:#3b7bbf}
.bublina.vysvetli:before{border-right-color:#3b7bbf}
.bublina.chvala{background:var(--zelena-svetla);border-color:var(--zelena)}
.bublina.chvala:before{border-right-color:var(--zelena)}
.tl-bublina{margin-top:10px;min-height:46px;padding:6px 18px;font-weight:bold;font-size:1rem;border:none;border-radius:12px;background:#3b7bbf;color:#fff}
.pravidlo{margin-top:10px;background:var(--zluta-svetla);border:2px solid var(--maslo);border-radius:12px;padding:8px 10px;font-weight:bold}

/* Klávesnice */
.klavesnice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto;transition:opacity .3s}
.klavesnice.spi{opacity:.35}
.klavesnice button{min-height:58px;font-size:1.5rem;font-weight:bold;border:none;border-radius:14px;background:#fff;box-shadow:0 4px 0 #e0c79e;border:2px solid #ecd6b0}
.klavesnice button:nth-child(3n+1){background:#FFF0D1}
.klavesnice button:nth-child(3n+2){background:#FDE6DA}
.klavesnice button:nth-child(3n){background:#E6F2DD}
.klavesnice .k-ok{background:var(--zelena) !important;color:#fff}
.klavesnice .k-zpet{background:#f1dcc0 !important}
.klavesnice button:active{transform:translateY(3px);box-shadow:none}

/* Učebna: košíky a plechy */
.velka-ikona{font-size:4rem;text-align:center}
.plech-velky{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:#e9c89a;border:3px solid var(--kura);border-radius:14px;padding:10px;min-height:70px}
.rohlik{font-size:1.8rem;min-width:48px;min-height:48px;border:none;background:transparent;border-radius:10px}
.rohlik.zbytek{background:var(--koral-svetla);outline:2px dashed var(--koral)}
.rohlik.pryc{visibility:hidden}
.kosiky{display:flex;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.kosik{text-align:center;min-width:100px}
.kosik-obsah{min-height:40px;font-size:1.2rem;display:flex;flex-wrap:wrap;justify-content:center}
.kosik-ikona{font-size:2.6rem;line-height:1}
.kosik-pocet{font-weight:bold;font-size:1.2rem}
.plechy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.plechy{grid-template-columns:1fr}}
.skup{background:#fff;border:3px solid #ecd6b0;border-radius:14px;padding:8px;text-align:center}
.skup.zvyr{border-color:#E0A800;background:#FFF6CF}
.skup-n{font-weight:bold;font-size:.9rem}
.skup-pocet{font-size:1.6rem;font-weight:bold;color:var(--kura)}
.ikony{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:40px;align-items:center}
.plech{display:inline-block;background:#8a5a3c;color:#ffe9c4;font-size:.7rem;font-weight:bold;padding:6px 6px;border-radius:4px}
.pytlik{display:inline-block;background:#f3d6a4;border:2px solid var(--kura);font-size:.7rem;font-weight:bold;padding:3px 5px;border-radius:8px 8px 4px 4px}
.kus{font-size:1.1rem}
.nic{opacity:.5}

/* Odměna */
.odmena{text-align:center}
.odmena h1{margin:6px 0}
.rohliky-hodnoceni{font-size:2.6rem;letter-spacing:6px}
.rohliky-hodnoceni .prazdny{filter:grayscale(1);opacity:.3}

/* Diplom */
.diplom{background:#fff;border:10px double var(--kura);border-radius:18px;padding:30px 24px;text-align:center;max-width:760px;margin:16px auto}
.diplom-ikona{font-size:3rem}
.diplom-nadpis{font-size:2.6rem;letter-spacing:10px;color:var(--kura);font-weight:bold}
.diplom-titul{font-size:1.6rem;font-weight:bold;margin:6px 0 16px}
.diplom-jmeno{font-size:2.2rem;font-family:Georgia,serif;font-style:italic;border-bottom:2px solid var(--maslo);display:inline-block;padding:0 20px 4px;margin-bottom:12px}
.diplom-text{font-size:1.1rem;max-width:520px;margin:0 auto}
.diplom-hvezdy{font-size:1.4rem;margin:14px 0}
.diplom-pata{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;gap:20px;flex-wrap:wrap}
.podpis{text-align:center;min-width:220px}
.podpis-cara{border-top:2px solid var(--cokolada);margin-bottom:4px}

/* Konfety */
.konfeta{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;z-index:50;animation:pad linear forwards}
@keyframes pad{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} .konfeta{display:none} }

@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .diplom, .diplom *{visibility:visible}
  .diplom{position:absolute;left:0;top:0;width:100%;max-width:none;margin:0}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// =====================================================================
// ===== DATA HRY: zde učitel upravuje obsah ============================
// U písemných příkladů stačí zadat dělence (a) a dělitele (b).
// Kroky, zbytky, odhad i zkoušku spočítá hra sama.
// =====================================================================
const HRA = {
  nazev: "Pekárna U Dělicího válečku",
  podtitul: "Písemné dělení jednociferným dělitelem",
  rocnik: "4. třída",
  autor: "Mgr. Helena Gřivová",
  klic: "4-mat-pekarna-deleni-v1",

  uvod: "Ve vesnici Mouková stojí malá pekárna U Dělicího válečku. Pekař Kvásek si včera podvrtnul ruku a objednávky se hromadí. „Potřebuju šikovného učně, který umí spravedlivě dělit. Každý košík musí dostat stejně!“",
  zaver: "Pekárna voní, výloha září a celá Mouková ví, kdo tu dělí nejspravedlivěji. Kvásek ti podává zlatý váleček: „Teď jsi Mistr písemného dělení!“",

  pochvaly: ["Spravedlivě rozděleno!", "Košíky sedí přesně!", "Voní to úspěchem!", "Kvásek by to líp nespočítal.", "Jako z cukrárny!", "Výborně, učni!", "Přesně tak!"],
  povzbuzeni: ["Hotovo! Těsto se taky nepovede vždycky napoprvé.", "Zvládnuto. Z chyb se peče nejlepší chleba.", "Hotovo! Příště to půjde ještě líp."],

  diplom: {
    titul: "Mistr písemného dělení",
    text: "se úspěšně vyučil(a) v pekárně U Dělicího válečku a zvládl(a) písemné dělení jednociferným dělitelem."
  },

  // ----- UČEBNA -----
  lekce: [
    { id: "l1", nazev: "Košíky a zbytek", ikona: "🧺", popis: "Co je dělení a co je zbytek", kroky: [
      { typ: "text", ikona: "👨‍🍳🧺", text: "Dělit znamená rozdělit na stejné díly. V pekárně platí: každý košík musí dostat stejně!" },
      { typ: "kosiky", pocet: 14, kosu: 3, text: "Klikej na rohlíky a rozdávej je do 3 košíků. Každý košík musí mít stejně." },
      { typ: "text", ikona: "🥐", text: "14 : 3 = 4, zbytek 2. Do každého košíku jdou 4 rohlíky a 2 zbydou. Kdyby zbyly 3, dali bychom do každého košíku ještě jeden.", pravidlo: "Zbytek je vždy menší než dělitel." },
      { typ: "uloha", uloha: { typ: "zpameti", a: 17, b: 5 } },
      { typ: "uloha", uloha: { typ: "zpameti", a: 20, b: 6 } },
      { typ: "uloha", uloha: { typ: "volba", zadani: "Kamarád spočítal: 23 : 4 = 4, zbytek 7. Je to správně?",
          moznosti: ["Ano, je to správně.", "Ne, správně je 5, zbytek 3."], spravne: "Ne, správně je 5, zbytek 3.",
          napoveda: "Porovnej zbytek s dělitelem.",
          vysvetleni: "Zbytek 7 je větší než 4, takže by se do košíku vešel ještě jeden. 5 · 4 = 20, zbydou 3. Správně je 23 : 4 = 5, zbytek 3." } }
    ]},
    { id: "l2", nazev: "Plechy, pytlíky, kusy", ikona: "🍞", popis: "Proč se připisuje další číslice", kroky: [
      { typ: "text", plechy: [1, 1, 1], text: "Pekař počítá pečivo po plechách, pytlících a kusech. Na plechu je 100 rohlíků, v pytlíku 10 a pak jsou tu jednotlivé kusy." },
      { typ: "text", plechy: [6, 3, 9], text: "Objednávka: 639 rohlíků rozděl do 3 košíků. To je 6 plechů, 3 pytlíky a 9 kusů." },
      { typ: "text", plechy: [6, 3, 9], zvyrazni: "s", text: "Nejdřív plechy: 6 : 3 = 2. Každý košík dostane 2 plechy. Nic nezbude." },
      { typ: "text", plechy: [6, 3, 9], zvyrazni: "d", text: "Pak pytlíky: 3 : 3 = 1. Každý košík dostane 1 pytlík." },
      { typ: "text", plechy: [6, 3, 9], zvyrazni: "j", text: "Nakonec kusy: 9 : 3 = 3. Každý košík má 2 plechy, 1 pytlík a 3 kusy. To je 213 rohlíků." },

// ----- Zvuky (bez souborů) -----
let actx = null;
function ton(freqs, delka = 0.12, typ = "sine") {
  if (!S.zvuk) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = typ; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delka);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + delka + 0.03);
      t += delka * 0.9;
    });
  } catch (e) {}
}
const zvukOK = () => ton([660, 880]);
const zvukChyba = () => ton([300, 240], 0.15, "triangle");
const zvukFanfara = () => ton([523, 659, 784, 1047], 0.17);

function rekni(text, typ = "info", tlacitko, fn) {
  const b = document.getElementById("bublina");
  if (!b) return;
  b.className = "bublina " + typ;
  b.innerHTML = `<div>${text}</div>` + (tlacitko ? `<button class="tl-bublina">${tlacitko}</button>` : "");
  if (tlacitko) { const x = $("button", b); x.onclick = () => { x.disabled = true; fn(); }; setTimeout(() => x.focus(), 50); }
}

// ----- Vstup čísel (klávesnice na obrazovce i fyzická) -----
let VSTUP = null;
function aktivuj(el, max, potvrd) {
  if (VSTUP && VSTUP.el) VSTUP.el.classList.remove("aktivni");
  VSTUP = { el, max, hodnota: "", potvrd };
  el.classList.add("aktivni"); el.classList.remove("spatne"); el.textContent = "";
  const k = document.getElementById("klav"); if (k) k.classList.remove("spi");
  try { el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); } catch (e) {}
}
function deaktivuj() {
  document.querySelectorAll(".konfeta").forEach(e => { if (!document.querySelector(".odmena, .diplom")) e.remove(); });
  if (VSTUP && VSTUP.el) VSTUP.el.classList.remove("aktivni");
  VSTUP = null;
  const k = document.getElementById("klav"); if (k) k.classList.add("spi");
}
function stisk(k) {
  if (!VSTUP) return;
  if (k === "⌫") VSTUP.hodnota = VSTUP.hodnota.slice(0, -1);
  else if (k === "OK") { if (VSTUP.hodnota === "") return; VSTUP.potvrd(parseInt(VSTUP.hodnota, 10)); return; }
  else if (/^\d$/.test(k) && VSTUP.hodnota.length < VSTUP.max) VSTUP.hodnota += k;
  else return;
  if (VSTUP.chyba) { VSTUP.chyba = false; VSTUP.el.classList.remove("spatne"); }
  VSTUP.el.textContent = VSTUP.hodnota;
  // políčko se odešle samo, jakmile má tolik číslic jako správná odpověď
  if (/^\d$/.test(k) && VSTUP.hodnota.length === VSTUP.max) VSTUP.potvrd(parseInt(VSTUP.hodnota, 10));
}
document.addEventListener("keydown", e => {
  if (!VSTUP || e.target.tagName === "INPUT") return;
  if (/^\d$/.test(e.key)) { stisk(e.key); e.preventDefault(); }
  else if (e.key === "Backspace") { stisk("⌫"); e.preventDefault(); }
  else if (e.key === "Enter") { stisk("OK"); e.preventDefault(); }
});
function klavesniceHTML() {
  return `<div class="klavesnice spi" id="klav">${["1","2","3","4","5","6","7","8","9","⌫","0","OK"].map(k =>

}
function napojKlavesnici() { $$("#klav button").forEach(b => b.onclick = () => stisk(b.dataset.k)); }

// Políčko s kontrolou: 2 pokusy, potom Kvásek ukáže a vysvětlí
function pole(el, max, spravna, o, stav) {
  let pokusy = 0;
  max = String(spravna).length;
  aktivuj(el, max, n => {
    if (n === spravna) {
      deaktivuj(); el.textContent = spravna; el.classList.remove("spatne"); el.classList.add("hotove"); zvukOK(); o.ok();
    } else {
      pokusy++; stav.chyby++; zvukChyba(); el.classList.add("spatne");
      if (pokusy >= 2) {
        deaktivuj(); el.textContent = spravna; el.classList.remove("spatne"); el.classList.add("odhaleno");
        rekni(o.odhal(n), "vysvetli", "Rozumím ➜", o.ok);
      } else {
        rekni(o.chyba(n), "napoveda");
        VSTUP.hodnota = ""; VSTUP.chyba = true;
      }
    }
  });
}

}

  box.innerHTML = `<div class="zadani">Vyděl zpaměti. Kolik dostane každý košík a kolik zbude?</div>

  const [pq, pr] = $$(".bunka", box);
  rekni(`Kolikrát se ${u.b} vejde do ${u.a}?`);
  pole(pq, String(q).length, q, {
    chyba: n => n * u.b > u.a ? `${n} · ${u.b} = ${n * u.b}, to je víc než ${u.a}. Zkus menší číslo.`
                              : `${n} · ${u.b} = ${n * u.b}, zbylo by ${u.a - n * u.b}. To je víc než ${u.b}, vejde se ještě jednou.`,
    odhal: () => q === 0 ? `${u.a} je menší než ${u.b}, vejde se tam nulakrát. Výsledek je 0.` : `Správně je ${q}, protože ${q} · ${u.b} = ${q * u.b}.`,
    ok: () => {
      rekni(`A kolik zbude? ${u.a} − ${q * u.b} = ?`);
      pole(pr, 1, r, {
        chyba: n => n >= u.b ? `Zbytek ${n} není menší než ${u.b}. Zbytek je vždy menší než dělitel.` : `Zbytek je ${u.a} − ${q * u.b}. Spočítej to znovu.`,
        odhal: () => `Zbytek je ${r}, protože ${u.a} − ${q * u.b} = ${r}.`,
        ok: () => done(`${u.a} : ${u.b} = ${q}, zbytek ${r}.`)
      }, stav);
    }
  }, stav);
}

function ulohaVolba(box, u, p, stav, done) {
  box.innerHTML = `<div class="zadani">${u.zadani}</div><div class="volby"></div>`;
  rekni(u.otazka || "Vyber správnou odpověď.");
  let pokusy = 0, konec = false;
  const zaver = (ok) => {
    konec = true; $$(".volba", box).forEach(x => x.disabled = true);
    if (u.cekat) rekni((ok ? nahodny(HRA.pochvaly) + " " : "") + u.vysvetleni, ok ? "chvala" : "vysvetli", "Pokračovat ➜", () => done());
    else done(u.vysvetleni);
  };
  zamichej(u.moznosti).forEach(m => {
    const b = document.createElement("button");
    b.className = "volba"; b.textContent = m;
    b.onclick = () => {

      if (m === u.spravne) { b.classList.add("ok"); zvukOK(); zaver(pokusy === 0); }
      else {

        if (pokusy >= 2) { $$(".volba", box).forEach(x => { if (x.textContent === u.spravne) x.classList.add("ok"); }); zaver(false); }
        else rekni(u.napoveda, "napoveda");
      }

  });
}

function odhadUloha(a, b, cekat) {
  const q = Math.floor(a / b), st = q >= 100 ? 100 : 10, L = Math.floor(q / st) * st;
  const start = Math.max(st, L - st);
  const opt = x => `mezi ${x} a ${x + st}`;
  return {
    typ: "volba", cekat, zadani: `Odhadni výsledek: ${a} : ${b}`, otazka: "Mezi kterými čísly bude výsledek?",
    moznosti: [start, start + st, start + 2 * st].map(opt), spravne: opt(L),
    napoveda: `Najdi čísla, která umíš vydělit ${b} zpaměti. Kolik je ${L * b} : ${b}?`,
    vysvetleni: `Zpaměti: ${L * b} : ${b} = ${L} a ${(L + st) * b} : ${b} = ${L + st}. Číslo ${a} je mezi nimi, takže výsledek bude ${opt(L)}.`
  };
}

// Zkouška pod sebou: podíl · dělitel (+ zbytek) = dělenec
function zkouskaMrizka(q, b, r, vyplnit) {
  const prod = q * b, a = prod + r;
  const W = Math.max(String(a).length, String(prod).length, String(q).length) + 1;
  const rows = r ? 5 : 3;
  const g = document.createElement("div");
  g.className = "mrizka zkouska-mrizka";
  g.style.gridTemplateColumns = `repeat(${W}, var(--bunka))`;
  g.style.gridTemplateRows = `repeat(${rows}, var(--bunka))`;
  const cell = (row, col, cls, txt) => { const e = document.createElement("div"); e.className = "b " + (cls || ""); e.style.gridRow = row + 1; e.style.gridColumn = col + 1; e.textContent = txt ?? ""; g.appendChild(e); return e; };
  const cara = row => { const e = document.createElement("div"); e.className = "cara-radek"; e.style.gridRow = row + 1; e.style.gridColumn = "1 / -1"; g.appendChild(e); };
  // vrací buňky čísla zprava doleva (jednotky první)
  const cislo = (row, num, cls, prazdne) => { const t = String(num); return [...t].map((ch, i) => cell(row, W - t.length + i, cls, prazdne ? "" : ch)).reverse(); };
  const Q = cislo(0, q); cell(1, 0, "znak", "·"); const B = cislo(1, b);
  cara(2); const P = cislo(2, prod, vyplnit ? "" : "podil", !vyplnit);
  let R = [], A = [];
  if (r) { cell(3, 0, "znak", "+"); R = cislo(3, r); cara(4); A = cislo(4, a, vyplnit ? "" : "podil", !vyplnit); }
  const zvyr = arr => { g.querySelectorAll(".zvyr").forEach(e => e.classList.remove("zvyr")); arr.forEach(e => e && e.classList.add("zvyr")); };
  return { g, Q, B, P, R, A, zvyr };
}
function zkouskaStatic(q, b, r) {
  const d = document.createElement("div");
  d.className = "zkouska-ukaz";
  d.innerHTML = `<div><b>Zkouška pod sebou:</b></div>`;
  d.appendChild(zkouskaMrizka(q, b, r, true).g);
  d.insertAdjacentHTML("beforeend", `<div>Vyšel dělenec ${q * b + r}. ✓</div>`);
  return d;
}

function ulohaZkouska(box, u, p, stav, done) {
  const prod = u.q * u.b, a = prod + u.r;
  box.innerHTML = `<div class="zkouska">${u.uvod ? `<div class="zadani">${u.uvod}</div>` : ""}
    <div class="zadani">Zkouška: vynásob pod sebou${u.r ? " a přičti zbytek" : ""}. Piš zprava.</div><div class="mrizka-obal"></div></div>`;
  const Z = zkouskaMrizka(u.q, u.b, u.r, false);
  $(".mrizka-obal", box).appendChild(Z.g);
  const kroky = [];
  // násobení
  const qd = String(u.q).split("").reverse().map(Number);
  let c = 0;
  qd.forEach((d, i) => {
    const pred = c, t = d * u.b + pred, out = t % 10; c = Math.floor(t / 10);
    const nove = c;
    kroky.push(dal => {
      Z.zvyr([Z.Q[i], Z.B[0]]);
      rekni(`${d} · ${u.b}${pred ? ` + ${pred} (to si pamatuješ)` : ""} = ?` + (t >= 10 ? " Napiš jen poslední číslici, desítky si pamatuj." : ""));
      pole(Z.P[i], 1, out, {
        chyba: () => `Spočítej znovu: ${d} · ${u.b} = ${d * u.b}${pred ? ` a k tomu přičti ${pred}, co sis pamatoval(a)` : ""}. Napiš jen poslední číslici.`,
        odhal: () => `${d} · ${u.b}${pred ? ` + ${pred}` : ""} = ${t}. Napíšu ${out}${nove ? ` a ${nove} si pamatuji` : ""}.`,
        ok: dal
      }, stav);
    });
  });
  if (c > 0) {
    const zb = c;
    kroky.push(dal => {
      Z.zvyr([]);
      rekni("Už nemám co násobit. Napiš, co si pamatuješ.");
      pole(Z.P[qd.length], 1, zb, { chyba: () => "Kolik sis pamatoval(a) z posledního násobení?", odhal: () => `Pamatoval(a) jsem si ${zb}, tak to napíšu.`, ok: dal }, stav);
    });
  }
  // přičtení zbytku
  if (u.r) {
    const pd = String(prod).split("").reverse().map(Number);
    const n = String(a).length;
    let k = 0;
    for (let i = 0; i < n; i++) {
      const x = pd[i] || 0, y = i === 0 ? u.r : 0, pred = k, t = x + y + pred, out = t % 10; k = Math.floor(t / 10);
      kroky.push(dal => {
        Z.zvyr([Z.P[i], i === 0 ? Z.R[0] : null]);
        let otazka;
        if (i === 0) otazka = `Přičti zbytek: ${x} + ${u.r} = ?` + (t >= 10 ? " Napiš poslední číslici, 1 si pamatuj." : "");
        else if (pred && pd[i] === undefined) otazka = `Nad čarou už nic není. Napiš ${pred}, co si pamatuješ.`;
        else if (pred) otazka = `${x} + ${pred} (to si pamatuješ) = ?` + (t >= 10 ? " Napiš poslední číslici, 1 si pamatuj." : "");
        else otazka = `Tady už nic nepřičítám. Opiš ${x} dolů.`;
        rekni(otazka);
        pole(Z.A[i], 1, out, {
          chyba: () => i === 0 ? `Sečti ${x} + ${u.r}. Napiš jen poslední číslici.` : pred ? `Nezapomeň přičíst ${pred}, co sis pamatoval(a).` : `Opiš číslici ${x}, která je nad čarou.`,
          odhal: () => i === 0 || pred ? `${i === 0 ? `${x} + ${u.r}` : `${x} + ${pred}`} = ${t}. Napíšu ${out}.` : `Nic nepřičítám, číslici ${x} jen opíšu dolů.`,
          ok: dal
        }, stav);
      });
    }
  }
  retez(kroky, () => { Z.zvyr([]); done(`Vyšel dělenec ${a}, takže je výpočet správně.`); });
}

// Rozpis písemného dělení podle učebnice
function rozpis(a, b) {
  const dig = String(a).split("").map(Number);
  let p = 1, cur = dig[0];
  while (cur < b && p < dig.length) { cur = cur * 10 + dig[p]; p++; }
  const kroky = []; let col = p - 1;
  while (true) {
    const q = Math.floor(cur / b), r = cur - q * b;
    const k = { cur, q, r, col }; kroky.push(k);
    if (col + 1 < dig.length) { k.d = dig[col + 1]; cur = r * 10 + k.d; col++; } else break;
  }
  return { dig, kroky, prefixLen: p, Q: Math.floor(a / b), R: a % b };
}

function cisliceUloha(R, u) {
  const n = R.dig.length, s = R.kroky.length;
  return {
    typ: "volba", cekat: true, zadani: `${u.a} : ${u.b}`, otazka: "Než začneš: kolik číslic bude mít podíl?",
    moznosti: [`${n - 1} číslice`, `${n} číslice`], spravne: `${s} číslice`,
    napoveda: `Podívej se na první číslici ${R.dig[0]}. Vejde se do ní ${u.b}?`,
    vysvetleni: R.prefixLen > 1
      ? `První číslice ${R.dig[0]} je menší než ${u.b}, proto začínám číslem ${R.kroky[0].cur}. Podíl bude mít ${s} číslice.`
      : `Do první číslice ${R.dig[0]} se ${u.b} vejde. Podíl bude mít ${s} číslice.`
  };
}

function ulohaPisemne(box, u, p, stav, done) {
  const R = rozpis(u.a, u.b), n = R.dig.length, s = R.kroky.length;
  box.innerHTML = `<div class="zadani">${u.zadaniText || "Vyděl písemně."}</div><div class="pred"></div><div class="mrizka-obal"></div><div class="po"></div>`;
  const pred = $(".pred", box), obal = $(".mrizka-obal", box), po = $(".po", box);
  const predUlohy = [];
  if (p.odhad) predUlohy.push(odhadUloha(u.a, u.b, true));
  if (p.cislice) predUlohy.push(cisliceUloha(R, u));
  let D = [], B, Q = [], RC = [], PC = [];

  retez(predUlohy.map(x => c => { const d = document.createElement("div"); pred.appendChild(d); ulohaVolba(d, x, p, stav, c); }),
    () => { nakresli(); krok(0, "q"); });

  function nakresli() {
    const cols = n + 3 + s;
    const g = document.createElement("div");
    g.className = "mrizka";
    g.style.gridTemplateColumns = `repeat(${cols}, var(--bunka))`;
    g.style.gridTemplateRows = `repeat(${s + 1}, var(--bunka))`;
    const cell = (r, c, cls, txt) => { const e = document.createElement("div"); e.className = "b " + (cls || ""); e.style.gridRow = r + 1; e.style.gridColumn = c + 1; e.textContent = txt ?? ""; g.appendChild(e); return e; };
    R.dig.forEach((d, i) => D.push(cell(0, i, "", d)));
    cell(0, n, "znak", ":"); B = cell(0, n + 1, "", u.b); cell(0, n + 2, "znak", "=");
    for (let i = 0; i < s; i++) Q.push(cell(0, n + 3 + i, "podil"));
    R.kroky.forEach((k, i) => { RC.push(cell(i + 1, k.col, "vstup")); PC.push(k.d !== undefined ? cell(i + 1, k.col + 1, "vstup") : null); });
    obal.appendChild(g);
  }
  function zvyr(arr) { $$(".zvyr", obal).forEach(e => e.classList.remove("zvyr")); arr.forEach(e => e && e.classList.add("zvyr")); }
  function aktualni(i) { return i === 0 ? D.slice(0, R.prefixLen) : [RC[i - 1], PC[i - 1]]; }
  function chybaPodilu(x, k) {
    if (k.q === 0) return `${k.cur} je menší než ${u.b}. Kolikrát se tam ${u.b} vejde? Nulakrát!`;
    if (x * u.b > k.cur) return `${x} · ${u.b} = ${x * u.b}, to je víc než ${k.cur}. Zkus menší číslo.`;
    return `${x} · ${u.b} = ${x * u.b}, zbylo by ${k.cur - x * u.b}. To je víc než ${u.b}, vejde se ještě jednou.`;
  }

  function krok(i, faze) {
    const k = R.kroky[i];
    zvyr([]);
    if (faze === "q") {
      if (p.zvyraznit) {
        zvyr([...aktualni(i), B]);
        let t = `Kolikrát se ${u.b} vejde do ${k.cur}?`;
        if (i === 0 && R.prefixLen > 1) t = `${R.dig[0]} je menší než ${u.b}, proto beru ${k.cur}. ` + t;
        rekni(t);
      } else rekni(i === 0 ? "Začni dělit. Napiš první číslici podílu." : "Napiš další číslici podílu.");
      pole(Q[i], 1, k.q, {
        chyba: x => chybaPodilu(x, k),
        odhal: () => k.q === 0 ? `${k.cur} je menší než ${u.b}, vejde se tam nulakrát. Nulu do podílu musíš napsat!` : `Správně je ${k.q}, protože ${k.q} · ${u.b} = ${k.q * u.b} a zbude ${k.r}.`,
        ok: () => krok(i, "r")
      }, stav);
    } else if (faze === "r") {
      if (p.zvyraznit) { zvyr([...aktualni(i), Q[i]]); rekni(`Kolik zbude? ${k.cur} − ${k.q * u.b} = ?`); }
      else rekni("Napiš zbytek.");
      pole(RC[i], 1, k.r, {
        chyba: x => x >= u.b ? `Zbytek ${x} není menší než ${u.b}. Zbytek je vždy menší než dělitel.` : `Zbytek je ${k.cur} − ${k.q} · ${u.b}, tedy ${k.cur} − ${k.q * u.b}. Spočítej to znovu.`,
        odhal: () => `Zbytek je ${k.r}, protože ${k.cur} − ${k.q * u.b} = ${k.r}.`,
        ok: () => k.d !== undefined ? krok(i, "p") : konec()
      }, stav);
    } else {
      const zdroj = D[k.col + 1], dalsi = R.kroky[i + 1].cur;
      if (p.pripisuje === "hra") {
        zvyr([zdroj]); PC[i].classList.add("ukazane");
        rekni(`Připisuji další číslici ${k.d}. Teď budu dělit ${dalsi}.`);
        const t = TOKEN;
        setTimeout(() => {
          if (t !== TOKEN) return;
          PC[i].textContent = k.d; PC[i].classList.add("hotove"); zvyr([zdroj, PC[i]]);
          setTimeout(() => { if (t === TOKEN) krok(i + 1, "q"); }, 1100);
        }, 700);
      } else {
        if (p.zvyraznit) { zvyr([zdroj]); rekni("Připiš další číslici dělence (je zvýrazněná)."); }
        else rekni("Připiš další číslici dělence.");
        pole(PC[i], 1, k.d, {
          chyba: () => `Podívej se na dělence ${u.a}. Která číslice je teď na řadě?`,
          odhal: () => `Na řadě je číslice ${k.d}. Zbytek ${k.r} a připsaná ${k.d} dávají ${dalsi}.`,
          ok: () => krok(i + 1, "q")
        }, stav);
      }
    }
  }

  function konec() {
    zvyr([]);
    const vys = `${u.a} : ${u.b} = ${R.Q}${R.R ? `, zbytek ${R.R}` : ""}`;
    po.innerHTML = `<div class="vysledek">${u.a} : ${u.b} = ${R.Q}${R.R ? ` (zb. ${R.R})` : ""}</div>`;
    if (p.zkouska === "ukaz") {
      po.appendChild(zkouskaStatic(R.Q, u.b, R.R));
      done(vys + ".");
    } else if (p.zkouska === "zak") {
      const d = document.createElement("div"); po.appendChild(d);
      ulohaZkouska(d, { q: R.Q, b: u.b, r: R.R, a: u.a }, p, stav, m => done(vys + ". " + m));
    } else done(vys + ".");
  }
}

function hub() {
  TOKEN++; deaktivuj();
  const vse = HRA.mise.every(m => S.mise[m.id] && S.mise[m.id].hotovo);
  const lekce = HRA.lekce.map((l, i) => `<button class="karta ${S.lekce[l.id] ? "hotova" : ""}" data-l="${i}">
      <div class="k-ikona">${l.ikona}</div><div><div class="k-nazev">${i + 1}. ${l.nazev}</div><div class="k-popis">${l.popis}</div>
      <div class="k-stav">${S.lekce[l.id] ? "✔ Prošel(a) jsi" : "Klikni a nauč se"}</div></div></button>`).join("");
  const mise = HRA.mise.map((m, i) => {
    const st = S.mise[m.id], odem = miseOdemcena(i);
    const rz = S.rozp[m.id], rozp = rz && rz.index > 0;
    const stav = !odem ? "🔒 Nejdřív splň předchozí objednávku" : rozp ? `▶ Pokračovat od úlohy ${rz.index + 1}` : st && st.hotovo ? `<span class="rohliky-mini">${rohliky(st.hvezdy)}</span>` : "Nová objednávka";
    return `<button class="karta ${st && st.hotovo ? "hotova" : ""} ${odem ? "" : "zamcena"}" data-m="${i}" ${odem ? "" : 'aria-disabled="true"'}>
      <div class="k-ikona">${m.ikona}</div><div><div class="k-nazev">${i + 1}. ${m.nazev}</div><div class="k-popis">${m.popis}</div><div class="k-stav">${stav}</div></div></button>`;
  }).join("");
  app.innerHTML = `<div class="obrazovka">
    <header class="lista"><div class="lista-nazev">🥖 ${HRA.nazev}</div>
      <div class="lista-tl"><button id="pismo" title="Velikost písma" aria-label="Velikost písma">A+</button>
      <button id="zvuk" title="Zvuk" aria-label="Zvuk zapnout nebo vypnout">${S.zvuk ? "🔊" : "🔈"}</button>
      <button id="reset" title="Začít znovu" aria-label="Začít znovu">↺</button></div></header>
    <div class="vitej">Učeň: <b>${esc(S.jmeno)}</b>. ${Object.keys(S.lekce).length === 0 ? "Tip: začni v Učebně, Kvásek ti všechno ukáže." : "Vyber si, co budeš dělat."}</div>
    ${scena()}
    <h2>📖 Učebna</h2><div class="dlazdice">${lekce}</div>
    <h2>🧺 Objednávky (trénink)</h2><div class="dlazdice">${mise}</div>
    ${vse ? '<button class="tl-hlavni" id="diplom">🏆 Závěr a diplom</button>' : '<p class="tip">Diplom získáš, až splníš všech 7 objednávek.</p>'}
    <p class="autor" style="text-align:center">${HRA.podtitul} · ${HRA.rocnik} · ${HRA.autor}</p>
  </div>`;
  $$("[data-l]").forEach(b => b.onclick = () => spustLekci(+b.dataset.l, 0));
  $$("[data-m]").forEach(b => b.onclick = () => { const i = +b.dataset.m; if (miseOdemcena(i)) spustMisi(i); });
  $("#pismo").onclick = () => { S.pismo = ((S.pismo || 0) + 1) % 3; nastavPismo(); uloz(); };
  $("#zvuk").onclick = () => { S.zvuk = !S.zvuk; uloz(); hub(); };
  $("#reset").onclick = () => { if (confirm("Opravdu chceš začít úplně od začátku? Smaže se celý postup i jméno.")) { S = JSON.parse(JSON.stringify(VYCHOZI)); uloz(); nastavPismo(); uvod(); } };
  if (vse) $("#diplom").onclick = diplom;
}

function pracovniHTML(nazev, pocet, podil, nav) {
  return `<div class="obrazovka">
    <header class="lista"><button class="tl-mensi" id="zpet">🏠 Domů</button><div class="lista-nazev">${nazev}</div><div class="lista-pocet">${pocet}</div></header>
    <div class="progres"><div style="width:${podil * 100}%"></div></div>
    <main class="pracovni">
      <div class="karta-ulohy" id="box"></div>
      <div class="kvasek-obal"><div class="kvasek"><div class="kvasek-tvar" aria-hidden="true">👨‍🍳</div><div class="bublina" id="bublina" aria-live="polite"></div></div>${nav}</div>
      <div class="ovladani">${klavesniceHTML()}</div>
    </main></div>`;
}

// ----- Učebna -----
function plechyViz(t, zv) {
  const [s, d, j] = t;
  const rep = (n, html) => n ? Array.from({ length: n }, () => html).join("") : '<span class="nic">nic</span>';
  return `<div class="plechy">
    <div class="skup ${zv === "s" ? "zvyr" : ""}"><div class="skup-n">Plechy po 100</div><div class="ikony">${rep(s, '<span class="plech">100</span>')}</div><div class="skup-pocet">${s}</div></div>
    <div class="skup ${zv === "d" ? "zvyr" : ""}"><div class="skup-n">Pytlíky po 10</div><div class="ikony">${rep(d, '<span class="pytlik">10</span>')}</div><div class="skup-pocet">${d}</div></div>
    <div class="skup ${zv === "j" ? "zvyr" : ""}"><div class="skup-n">Kusy</div><div class="ikony">${rep(j, '<span class="kus">🥐</span>')}</div><div class="skup-pocet">${j}</div></div>
  </div>`;
}
function kosikyDemo(box, K, hotovo) {
  const q = Math.floor(K.pocet / K.kosu), r = K.pocet % K.kosu;
  let polozeno = 0;
  box.innerHTML = `<div class="plech-velky">${Array.from({ length: K.pocet }, () => '<button class="rohlik" aria-label="rohlík">🥐</button>').join("")}</div>
    <div class="kosiky">${Array.from({ length: K.kosu }, (_, i) => `<div class="kosik"><div class="kosik-obsah"></div><div class="kosik-ikona">🧺</div><div class="kosik-pocet">0</div></div>`).join("")}</div>`;
  rekni(K.text);
  const obsahy = $$(".kosik-obsah", box), pocty = $$(".kosik-pocet", box);
  $$(".rohlik", box).forEach(b => b.onclick = () => {
    if (K.pocet - polozeno < K.kosu || b.classList.contains("pryc") || b.classList.contains("zbytek")) return;
    const ki = polozeno % K.kosu; polozeno++;
    b.classList.add("pryc"); obsahy[ki].insertAdjacentHTML("beforeend", "🥐");
    pocty[ki].textContent = obsahy[ki].textContent.length / "🥐".length;
    ton([520 + ki * 80], 0.08);
    if (K.pocet - polozeno < K.kosu) {
      $$(".rohlik:not(.pryc)", box).forEach(x => x.classList.add("zbytek"));
      rekni(`Každý košík má ${q} rohlíky. Zbyly ${r}. Na všechny košíky už nestačí, to je zbytek!`, "chvala");
      hotovo();
    } else if (polozeno % K.kosu === 0) rekni(`Každý košík má zatím ${polozeno / K.kosu}. Rozdávej dál!`);
  });
}

function spustLekci(li, k) {
  const L = HRA.lekce[li];
  TOKEN++; deaktivuj();
  const K = L.kroky[k];
  const posledni = k === L.kroky.length - 1;
  app.innerHTML = pracovniHTML(`${L.ikona} ${L.nazev}`, `${k + 1} / ${L.kroky.length}`, (k + 1) / L.kroky.length,
    `<div class="nav"><button class="tl-druhe" id="predK" ${k === 0 ? "disabled" : ""}>← Zpět</button><button class="tl-hlavni" id="dalK">${posledni ? "Hotovo ✓" : "Další ➜"}</button></div>`);
  napojKlavesnici();
  const box = $("#box"), dal = $("#dalK");
  if (K.typ !== "uloha") $(".ovladani").classList.add("skryte");
  const hotovo = () => { dal.disabled = false; dal.classList.add("pulz"); };
  $("#zpet").onclick = hub;
  $("#predK").onclick = () => { if (k > 0) spustLekci(li, k - 1); };
  dal.onclick = () => {
    if (!posledni) return spustLekci(li, k + 1);
    S.lekce[L.id] = true; uloz(); lekceHotova(li);
  };
  if (K.typ === "text") {
    box.innerHTML = K.plechy ? plechyViz(K.plechy, K.zvyrazni) : K.zkouska ? "" : `<div class="velka-ikona">${K.ikona || "👨‍🍳"}</div>`;
    if (K.zkouska) box.appendChild(zkouskaStatic(...K.zkouska));
    rekni(K.text + (K.pravidlo ? `<div class="pravidlo">📌 ${K.pravidlo}</div>` : ""));
  } else if (K.typ === "kosiky") {
    dal.disabled = true; kosikyDemo(box, K, hotovo);
  } else {
    dal.disabled = true;
    const stav = { chyby: 0 };
    spustUlohu(box, K.uloha, K.podpora || PLNA_PODPORA, stav, msg => {
      deaktivuj();
      rekni((stav.chyby ? nahodny(HRA.povzbuzeni) : nahodny(HRA.pochvaly)) + (msg ? "<br>" + msg : ""), stav.chyby ? "info" : "chvala");
      hotovo();
    });
  }
}
function lekceHotova(li) {
  TOKEN++; deaktivuj();
  const L = HRA.lekce[li], dalsi = HRA.lekce[li + 1];
  app.innerHTML = `<div class="obrazovka odmena"><div class="uvod-karta">
    <div class="velka-ikona">${L.ikona}✔</div><h1>Lekce hotová!</h1><p>${L.nazev}: teď už víš, jak na to.</p>
    ${dalsi ? `<button class="tl-hlavni" id="dalsiL">Další lekce: ${dalsi.nazev} ➜</button>` : `<p>Prošel(a) jsi celou Učebnu. Hurá na objednávky!</p>`}
    <button class="tl-druhe" id="domu" style="margin-top:14px">🏠 Domů</button></div></div>`;
  zvukFanfara();
  if (dalsi) $("#dalsiL").onclick = () => spustLekci(li + 1, 0);
  $("#domu").onclick = hub;
}

// ----- Trénink -----
function spustMisi(mi) {
  const m = HRA.mise[mi];
  const rz = S.rozp[m.id];
  if (rz && rz.index > 0 && rz.index < m.ulohy.length) return zobrazUlohu(mi, rz.index, rz.spravne);
  TOKEN++; deaktivuj();
  app.innerHTML = `<div class="obrazovka">
    <header class="lista"><button class="tl-mensi" id="zpet">🏠 Domů</button><div class="lista-nazev">${m.ikona} ${m.nazev}</div></header>
    <div class="uvod-karta"><div class="velka-ikona">${m.ikona}</div><h1>${m.nazev}</h1>
      <div class="kvasek" style="text-align:left"><div class="kvasek-tvar">👨‍🍳</div><div class="bublina"><div>${m.uvod}</div></div></div>
      <p class="male">Úloh: ${m.ulohy.length}. Za objednávku dostaneš až 3 rohlíky podle toho, kolik úloh zvládneš napoprvé.</p>
      <button class="tl-hlavni" id="go">Začít ➜</button></div></div>`;
  $("#zpet").onclick = hub;
  $("#go").onclick = () => { S.rozp[m.id] = { index: 0, spravne: 0 }; uloz(); zobrazUlohu(mi, 0, 0); };
}
function zobrazUlohu(mi, idx, sprav) {
  const m = HRA.mise[mi], u = m.ulohy[idx];
  TOKEN++; deaktivuj();
  app.innerHTML = pracovniHTML(`${m.ikona} ${m.nazev}`, `${idx + 1} / ${m.ulohy.length}`, idx / m.ulohy.length,
    `<button class="tl-hlavni skryte" id="dalsi">${idx + 1 < m.ulohy.length ? "Další úloha ➜" : "Dokončit objednávku ✓"}</button>`);
  napojKlavesnici();
  $("#zpet").onclick = hub;
  const stav = { chyby: 0 };
  spustUlohu($("#box"), u, m.podpora, stav, msg => {
    deaktivuj();
    const ok = stav.chyby === 0;
    if (ok) sprav++;
    rekni((ok ? nahodny(HRA.pochvaly) : nahodny(HRA.povzbuzeni)) + (msg ? "<br>" + msg : ""), ok ? "chvala" : "info");
    S.rozp[m.id] = { index: idx + 1, spravne: sprav }; uloz();
    const t = $("#dalsi"); t.classList.remove("skryte"); setTimeout(() => t.focus(), 50);
    t.onclick = () => idx + 1 < m.ulohy.length ? zobrazUlohu(mi, idx + 1, sprav) : dokonciMisi(mi, sprav);
  });
}
function dokonciMisi(mi, sprav) {
  TOKEN++; deaktivuj();
  const m = HRA.mise[mi], n = m.ulohy.length, pomer = sprav / n;
  const hv = pomer >= 0.9 ? 3 : pomer >= 0.7 ? 2 : 1;
  const pred = S.mise[m.id];
  S.mise[m.id] = { hotovo: true, hvezdy: Math.max(hv, pred ? pred.hvezdy : 0) };
  delete S.rozp[m.id]; uloz();
  const vse = HRA.mise.every(x => S.mise[x.id] && S.mise[x.id].hotovo);
  app.innerHTML = `<div class="obrazovka odmena">
    <h1>Objednávka splněna! ${m.ikona}</h1>
    ${scena(m.odmena)}
    <p style="font-size:1.15rem"><b>${m.odmenaText}</b></p>
    <div class="rohliky-hodnoceni">${rohliky(hv)}</div>
    <p>Napoprvé správně: <b>${sprav} z ${n}</b>.${hv < 3 ? " Objednávku si můžeš kdykoli zopakovat a získat víc rohlíků." : ""}</p>
    ${vse ? '<button class="tl-hlavni" id="zaver">🏆 Závěr a diplom</button>' : ""}
    <button class="${vse ? "tl-druhe" : "tl-hlavni"}" id="domu" style="margin-top:14px">🏠 Domů</button>
  </div>`;
  zvukFanfara(); konfety();
  $("#domu").onclick = hub;
  if (vse) $("#zaver").onclick = diplom;
}

function konfety() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 36; i++) {
    const e = document.createElement("div");
    e.className = "konfeta"; e.textContent = nahodny(["🥐", "🍞", "🥨", "✨", "🧁", "⭐"]);
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = 2 + Math.random() * 2 + "s";
    e.style.animationDelay = Math.random() * 0.8 + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 5000);
  }
}

function diplom() {
  TOKEN++; deaktivuj();
  const celkem = HRA.mise.reduce((s, m) => s + (S.mise[m.id] ? S.mise[m.id].hvezdy : 0), 0);
  const datum = new Date().toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" });
  app.innerHTML = `<div class="obrazovka">
    <header class="lista"><button class="tl-mensi" id="zpet">🏠 Domů</button><div class="lista-nazev">🏆 Závěr</div></header>
    <p class="pribeh">${HRA.zaver}</p>
    <div class="diplom">
      <div class="diplom-ikona">👨‍🍳🥖🏆</div>
      <div class="diplom-nadpis">DIPLOM</div>
      <div class="diplom-titul">${HRA.diplom.titul}</div>
      <div class="diplom-jmeno">${esc(S.jmeno)}</div>
      <div class="diplom-text">${HRA.diplom.text}</div>
      <div class="diplom-hvezdy">Získané rohlíky: ${celkem} z ${HRA.mise.length * 3} 🥐</div>
      <div class="diplom-pata"><div>Datum: ${datum}</div><div class="podpis"><div class="podpis-cara"></div>${HRA.autor}</div></div>
    </div>
    <button class="tl-hlavni" id="tisk">🖨️ Vytisknout diplom</button>
  </div>`;
  zvukFanfara(); konfety();
  $("#zpet").onclick = hub;
  $("#tisk").onclick = () => window.print();
}

// ----- Start -----
nacti(); nastavPismo();
if (S.jmeno) hub(); else uvod();
</script>
</body>
</html>
